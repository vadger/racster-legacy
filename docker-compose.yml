services:
  mysql:
    image: mysql:8.4
    container_name: racster-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: racster
      MYSQL_USER: racster
      MYSQL_PASSWORD: racster
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - racster-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  racster-mysql-data:
